services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-reservation-postgres
    environment:
      POSTGRES_DB: inventory_reservation
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./db/seeds:/docker-entrypoint-initdb.d/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_reservation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
